<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <header>
            <h1>🌤 Weather Dashboard</h1>
            <p>Check the current weather of any city</p>
        </header>

        <!-- Search Section -->
        <section class="search-section">

            <input
                type="text"
                id="cityInput"
                placeholder="Enter city name..."
            >

            <button id="searchBtn">
                🔍 Search
            </button>

        </section>

        <!-- Error Message -->
        <p id="errorMessage"></p>

        <!-- Loading -->
        <div id="loading">
            <div class="spinner"></div>
            <p>Fetching weather data...</p>
        </div>

        <!-- Weather Dashboard -->
        <section id="weatherContainer">

            <div class="location">
                <h2 id="cityName">--</h2>
                <p id="dateTime">--</p>
            </div>

            <div class="main-weather">

                <div class="weather-icon" id="weatherIcon">
                    🌤️
                </div>

                <div>
                    <h3 id="temperature">--°C</h3>
                    <p id="weatherCondition">--</p>
                </div>

            </div>

            <!-- Weather Details -->
            <div class="details">

                <div class="detail-card">
                    <span>🌡️</span>
                    <p>Feels Like</p>
                    <strong id="feelsLike">--°C</strong>
                </div>

                <div class="detail-card">
                    <span>💧</span>
                    <p>Humidity</p>
                    <strong id="humidity">--%</strong>
                </div>

                <div class="detail-card">
                    <span>💨</span>
                    <p>Wind Speed</p>
                    <strong id="windSpeed">-- km/h</strong>
                </div>

                <div class="detail-card">
                    <span>🧭</span>
                    <p>Wind Direction</p>
                    <strong id="windDirection">--°</strong>
                </div>

            </div>

        </section>

        <footer>
            <p>Weather data provided by Open-Meteo</p>
        </footer>

    </div>

    <script src="script.js"></script>

</body>
</html>
